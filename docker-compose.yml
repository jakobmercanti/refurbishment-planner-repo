services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: renovation_fit
      POSTGRES_USER: renovation
      POSTGRES_PASSWORD: renovation
    ports:
      - "5432:5432"
    volumes:
      - renovation_fit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renovation -d renovation_fit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  renovation_fit_postgres:

